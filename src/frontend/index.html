<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Hunter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><line x1='16.5' y1='16.5' x2='22' y2='22'/></svg>" type="image/svg+xml">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
/* ─── Reset & Base ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #000000;
  --surface:   #030303;
  --card:      #080808;
  --card-hover:#0e0e0e;
  --border:    #1a1a1a;
  --border2:   #242424;
  --accent:    #4f8ef7;
  --accent2:   #7aabf7;
  --green:     #22c55e;
  --yellow:    #eab308;
  --orange:    #f97316;
  --red:       #ef4444;
  --cyan:      #06b6d4;
  --text:      #f0f0f0;
  --text2:     #c0c0c0;
  --text3:     #606060;
  --radius:    12px;
  --radius-sm: 7px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

/* ─── Header ─── */
header {
  position: sticky;
  top: 0;
  z-index: 200;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  flex-shrink: 0;
}
.logo-icon {
  width: 36px; height: 36px;
  background: #111;
  border: 1px solid var(--border2);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}
.logo-text { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
.logo-text span { color: var(--text2); }

.header-right { display: flex; align-items: center; gap: 8px; }

/* ─── Search ─── */
.search-wrap { position: relative; display: flex; align-items: center; }
.search-icon { position: absolute; left: 9px; color: var(--text3); pointer-events: none; }
.search-input {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-size: 13px; padding: 6px 28px 6px 28px;
  width: 220px; outline: none; transition: border-color 0.15s, width 0.2s;
}
.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--accent); width: 280px; }
.search-clear {
  position: absolute; right: 7px; background: none; border: none; color: var(--text3);
  cursor: pointer; font-size: 11px; padding: 2px 4px; line-height: 1;
}
.search-clear:hover { color: var(--text); }

/* ─── Buttons ─── */
.btn-ghost {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 7px 13px;
  border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-ghost:hover { background: var(--card-hover); border-color: var(--accent); color: var(--text); }
.btn-ghost:disabled { opacity: 0.35; cursor: default; pointer-events: none; }

.btn-primary {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent);
  border: 1px solid transparent;
  color: #fff;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-primary:hover { background: #3a7de8; }
.btn-primary:disabled { opacity: 0.4; cursor: default; pointer-events: none; }

.badge-pill {
  background: var(--border2);
  color: var(--text3);
  padding: 1px 7px;
  border-radius: 99px;
  font-size: 10px;
  font-weight: 600;
}
.badge-pill.hot { background: #ef444420; color: var(--red); }

/* ─── Stats Strip ─── */
.stats-strip {
  background: #000;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.stats-strip::-webkit-scrollbar { display: none; }

.stat-item {
  padding: 12px 28px 12px 0;
  margin-right: 28px;
  border-right: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.stat-item:last-child { border-right: none; }
.stat-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; }
.stat-num { font-size: 24px; font-weight: 800; color: var(--text); line-height: 1.1; letter-spacing: -0.5px; }
.stat-num.accent { color: var(--accent2); }
.stat-item.clickable { cursor: pointer; transition: opacity 0.15s; }
.stat-item.clickable:hover { opacity: 0.75; }
.stat-item.clickable .stat-label { text-decoration: underline dotted; text-underline-offset: 3px; }

/* ─── Filters ─── */
.filters-wrap {
  background: #000;
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.pill-group { display: flex; gap: 4px; flex-wrap: wrap; }

.pill {
  padding: 5px 13px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text3);
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.pill:hover { border-color: var(--accent); color: var(--text2); }
.pill.active {
  background: #000;
  border-color: var(--accent);
  color: var(--accent2);
  font-weight: 600;
}

.filter-sep {
  width: 1px; height: 20px;
  background: var(--border);
  flex-shrink: 0;
}

.filter-select-wrap { position: relative; display: inline-flex; align-items: center; }
.filter-select-wrap svg { position: absolute; right: 8px; pointer-events: none; color: var(--text3); }

select.fsel {
  appearance: none;
  -webkit-appearance: none;
  background: #000;
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 5px 28px 5px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s;
}
select.fsel:focus { border-color: var(--accent); }

.score-row { display: flex; align-items: center; gap: 8px; }
.score-row input[type=range] {
  width: 80px;
  accent-color: var(--accent);
  cursor: pointer;
}
.score-badge-inline {
  background: #000;
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 12px; font-weight: 700;
  min-width: 36px; text-align: center;
}

/* ─── Main layout ─── */
main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 20px 24px 40px;
}

.list-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.list-count { font-size: 12px; color: var(--text3); font-weight: 500; }

/* ─── Pagination ─── */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 28px;
}
.page-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: #000;
  color: var(--text2);
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}
.page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent2); }
.page-btn:disabled { opacity: 0.3; cursor: default; }
.page-info { font-size: 12px; color: var(--text3); padding: 0 8px; }

/* ─── Grid ─── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 14px;
}

/* ─── Job Card ─── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  position: relative;
  overflow: hidden;
}
.card:hover { border-color: var(--border2); box-shadow: 0 6px 28px rgba(0,0,0,0.7); }
.card.expanded { border-color: var(--accent); }

/* Score bar on left edge */
.card-score-bar {
  position: absolute;
  left: 0; top: 16px; bottom: 16px;
  width: 3px;
  border-radius: 0 3px 3px 0;
}
.bar-high  { background: linear-gradient(to bottom, var(--green), #16a34a); }
.bar-mid   { background: linear-gradient(to bottom, var(--yellow), #ca8a04); }
.bar-low   { background: linear-gradient(to bottom, var(--orange), #ea580c); }

.card-inner { padding-left: 10px; }

/* Card top row */
.card-top-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}

.card-title-block { flex: 1; min-width: 0; }

.card-title {
  font-size: 15px;
  font-weight: 650;
  color: var(--text);
  line-height: 1.35;
  margin-bottom: 4px;
}

.card-company {
  font-size: 12px;
  color: var(--text3);
  font-weight: 500;
}

.score-chip {
  flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center;
  background: #000;
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 6px 10px;
  min-width: 48px;
}
.score-chip-num { font-size: 18px; font-weight: 800; line-height: 1; letter-spacing: -0.5px; }
.score-chip-label { font-size: 9px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 1px; }
.chip-high { color: var(--green); }
.chip-mid  { color: var(--yellow); }
.chip-low  { color: var(--orange); }

/* Meta row */
.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.meta-tag {
  display: inline-flex; align-items: center; gap: 3px;
  background: #000;
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 500;
}

.source-tag { font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.src-arbeitnow    { background: #000; border-color: #1e3a1e; color: #4ade80; }
.src-bundesagentur{ background: #000; border-color: #2a2000; color: #fbbf24; }
.src-indeed       { background: #000; border-color: #1a2a50; color: #7aabf7; }
.src-linkedin     { background: #000; border-color: #0e2a4a; color: #38bdf8; }
.src-stepstone    { background: #000; border-color: #3a1a1a; color: #f87171; }

.remote-tag { background: #000; border-color: #0e3535; color: var(--cyan); }
.date-tag   { color: var(--text3); border-color: transparent; background: transparent; }

/* Reasoning */
.reasoning {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.6;
  padding: 9px 12px;
  background: #000;
  border: 1px solid var(--border2);
  border-left: 2px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

/* Skills */
.skills { display: flex; flex-wrap: wrap; gap: 5px; }
.skill-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: #000;
  border: 1px solid #1e3050;
  color: var(--accent2);
  padding: 3px 9px;
  border-radius: 6px;
  font-size: 11px; font-weight: 500;
}

/* Description toggle */
.desc-toggle {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text3);
  cursor: pointer;
  transition: color 0.15s;
  user-select: none;
}
.desc-toggle:hover { color: var(--accent2); }
.toggle-chevron { transition: transform 0.2s; }
.toggle-chevron.open { transform: rotate(180deg); }

/* Description box */
.desc-box {
  background: #000;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 12px; color: var(--text2);
  line-height: 1.75;
  white-space: pre-wrap;
  max-height: 340px;
  overflow-y: auto;
}
.desc-empty {
  background: #000;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12px; color: var(--text3);
  font-style: italic;
  display: flex; align-items: center; gap: 6px;
}

/* Action buttons */
.card-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.act-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.act-apply  { background: #000; border-color: #1a4a1a; color: var(--green); }
.act-apply:hover  { background: #0a140a; }
.act-link   { background: #000; border-color: var(--border2); color: var(--accent2); }
.act-link:hover   { background: #111; }
.act-save   { background: #000; border-color: var(--border2); color: var(--text2); }
.act-save:hover   { background: #111; }
.act-reject { background: #000; border-color: #4a1a1a; color: #f87171; }
.act-reject:hover { background: #140a0a; }
.act-restore { background: #000; border-color: #1a3a1a; color: #86efac; }
.act-restore:hover { background: #0a140a; }

/* ─── Empty State ─── */
.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 80px 20px;
}
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-title { font-size: 16px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
.empty-sub { font-size: 13px; color: var(--text3); }

/* ─── Modal ─── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  z-index: 500;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.modal {
  background: #0a0a0a;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  width: 100%; max-width: 680px;
  max-height: 80vh;
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,0.8);
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.modal-title { font-size: 14px; font-weight: 700; color: var(--text); }
.modal-close {
  background: transparent; border: none;
  color: var(--text3); cursor: pointer; padding: 4px;
  display: flex; align-items: center;
  transition: color 0.15s;
}
.modal-close:hover { color: var(--text); }
.modal-body { overflow-y: auto; padding: 12px 20px; flex: 1; }
.modal-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}

.pending-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
}
.pending-row:last-child { border-bottom: none; }
.pending-title { font-size: 13px; color: var(--text); font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pending-company { font-size: 11px; color: var(--text3); flex-shrink: 0; }
.pending-src { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }

/* ─── Toast ─── */
.toast-wrap {
  position: fixed;
  bottom: 24px; right: 24px;
  z-index: 999;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  background: #0f0f0f;
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 13px; font-weight: 500;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  display: flex; align-items: center; gap: 8px;
  max-width: 340px;
  animation: toastIn 0.2s ease;
}
.toast-dot { width: 8px; height: 8px; border-radius: 99px; flex-shrink: 0; }
.toast-dot.ok     { background: var(--green); }
.toast-dot.info   { background: var(--accent2); }
.toast-dot.error  { background: var(--red); }

@keyframes toastIn {
  from { transform: translateY(12px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

/* ─── Responsive ─── */
@media (max-width: 900px) {
  .grid { grid-template-columns: 1fr; }
  header { padding: 0 16px; }
  .stats-strip { padding: 0 16px; }
  .filters-wrap { padding: 10px 16px; }
  main { padding: 16px 16px 40px; }
  .filter-sep { display: none; }
}

@media (max-width: 600px) {
  .logo-text { display: none; }
  header { height: 50px; }
  .btn-ghost span, .btn-primary span { display: none; }
  .btn-ghost, .btn-primary { padding: 7px 10px; }
  .stat-item { padding: 10px 20px 10px 0; margin-right: 20px; }
  .stat-num { font-size: 20px; }
  .card { padding: 14px; }
  .card-inner { padding-left: 8px; }
  .card-title { font-size: 14px; }
  .score-chip { padding: 5px 8px; min-width: 42px; }
  .score-chip-num { font-size: 16px; }
  .act-btn span { display: none; }
  .act-btn { padding: 7px 10px; }
  .toast-wrap { bottom: 16px; right: 16px; left: 16px; }
  .toast { max-width: 100%; }
}

@keyframes spin { to { transform: rotate(360deg); } }
.spinning { animation: spin 1s linear infinite; }
</style>
</head>
<body x-data="app()" x-init="init()">

<!-- ── Header ── -->
<header>
  <div class="logo">
    <div class="logo-icon">🕵️</div>
    <div class="logo-text">Job<span>Hunter</span></div>
  </div>

  <div class="header-right">
    <div class="search-wrap">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" type="text" placeholder="Search jobs or companies…" x-model="searchQuery" @input="debouncedSearch()">
      <button class="search-clear" x-show="searchQuery" @click="searchQuery=''; goPage(1)">✕</button>
    </div>
    <button class="btn-ghost" :disabled="analyzing" @click="runAnalysis()" title="Analyze pending jobs">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" :class="{'spinning': analyzing}">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      <span x-text="analyzing ? 'Analyzing…' : 'Analyze'"></span>
      <span class="badge-pill" :class="{'hot': stats.pending_analysis > 0}" x-show="stats.pending_analysis >= 0" x-text="stats.pending_analysis"></span>
    </button>

    <button class="btn-primary" :disabled="running" @click="runScraper()" title="Scrape new jobs">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" :class="{'spinning': running}">
        <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      <span x-text="running ? 'Scraping…' : 'Scrape'"></span>
    </button>
  </div>
</header>

<!-- ── Stats ── -->
<div class="stats-strip">
  <div class="stat-item">
    <div class="stat-label">Total</div>
    <div class="stat-num accent" x-text="stats.total ?? '—'"></div>
  </div>
  <div class="stat-item">
    <div class="stat-label">New</div>
    <div class="stat-num" x-text="stats.new ?? '—'"></div>
  </div>
  <div class="stat-item">
    <div class="stat-label">Saved</div>
    <div class="stat-num" x-text="stats.saved ?? '—'"></div>
  </div>
  <div class="stat-item">
    <div class="stat-label">Applied</div>
    <div class="stat-num" x-text="stats.applied ?? '—'"></div>
  </div>
  <div class="stat-item">
    <div class="stat-label">Rejected</div>
    <div class="stat-num" style="color:var(--text3)" x-text="stats.rejected ?? '—'"></div>
  </div>
  <div class="stat-item clickable" @click="openPendingModal()" title="Click to see pending jobs">
    <div class="stat-label">Pending Analysis</div>
    <div class="stat-num" style="color:var(--text3)" x-text="stats.pending_analysis ?? '—'"></div>
  </div>
</div>

<!-- ── Filters ── -->
<div class="filters-wrap">
  <!-- Status -->
  <div class="pill-group">
    <template x-for="s in [{k:'all',l:'All'},{k:'new',l:'New'},{k:'saved',l:'Saved'},{k:'applied',l:'Applied'},{k:'rejected',l:'Rejected'}]" :key="s.k">
      <button class="pill" :class="{active: filterStatus===s.k}" @click="filterStatus=s.k; goPage(1)" x-text="s.l"></button>
    </template>
  </div>

  <div class="filter-sep"></div>

  <!-- Category -->
  <div class="pill-group">
    <template x-for="c in [{k:'',l:'All Jobs'},{k:'ai',l:'AI / ML'},{k:'robotics',l:'Robotics'},{k:'software',l:'Software'}]" :key="c.k">
      <button class="pill" :class="{active: filterCategory===c.k}" @click="filterCategory=c.k; goPage(1)" x-text="c.l"></button>
    </template>
  </div>

  <div class="filter-sep"></div>

  <!-- Source -->
  <div class="filter-select-wrap">
    <select class="fsel" x-model="filterSource" @change="goPage(1)" style="padding-right:28px;">
      <option value="">All Sources</option>
      <option value="arbeitnow">Arbeitnow</option>
      <option value="bundesagentur">Bundesagentur</option>
      <option value="indeed">Indeed</option>
      <option value="linkedin">LinkedIn</option>
      <option value="stepstone">StepStone</option>
      <option value="xing">Xing</option>
    </select>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
  </div>

  <!-- Date -->
  <div class="filter-select-wrap">
    <select class="fsel" x-model="filterDays" @change="goPage(1)" style="padding-right:28px;">
      <option value="">Any time</option>
      <option value="1">Last 24h</option>
      <option value="3">Last 3 days</option>
      <option value="7">Last 7 days</option>
      <option value="14">Last 14 days</option>
      <option value="30">Last 30 days</option>
    </select>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
  </div>

  <!-- Min Score -->
  <div class="score-row">
    <span style="font-size:11px;color:var(--text3);white-space:nowrap;">Min score</span>
    <input type="range" min="4" max="10" step="1" x-model="filterScore" @input="goPage(1)">
    <span class="score-badge-inline" x-text="filterScore + '+'"></span>
  </div>

  <div class="filter-sep"></div>

  <!-- Hide Senior toggle -->
  <button class="pill" :class="{active: excludeSenior}" @click="excludeSenior=!excludeSenior; goPage(1)">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:3px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
    Hide Senior
  </button>
</div>

<!-- ── Main ── -->
<main>
  <div class="list-header">
    <span class="list-count" x-text="totalJobs + ' jobs found · page ' + currentPage + ' of ' + totalPages"></span>
  </div>

  <div class="grid">
    <!-- Empty -->
    <template x-if="jobs.length === 0">
      <div class="empty">
        <div class="empty-icon">🌌</div>
        <div class="empty-title">No jobs found</div>
        <div class="empty-sub">Try adjusting your filters or run the scraper to fetch new listings.</div>
      </div>
    </template>

    <!-- Cards -->
    <template x-for="job in jobs" :key="job.slug">
      <div class="card" :class="{expanded: job._open}">

        <!-- Score bar -->
        <div class="card-score-bar"
          :class="job.relevance_score>=8 ? 'bar-high' : job.relevance_score>=6 ? 'bar-mid' : 'bar-low'"></div>

        <div class="card-inner">

          <!-- Top row: title + score -->
          <div class="card-top-row" @click="job._open = !job._open">
            <div class="card-title-block">
              <div class="card-title" x-text="job.title"></div>
              <div class="card-company" x-text="job.company"></div>
            </div>
            <div class="score-chip">
              <span class="score-chip-num"
                :class="job.relevance_score>=8 ? 'chip-high' : job.relevance_score>=6 ? 'chip-mid' : 'chip-low'"
                x-text="job.relevance_score"></span>
              <span class="score-chip-label">/10</span>
            </div>
          </div>

          <!-- Meta tags -->
          <div class="card-meta">
            <span x-show="job.location && job.location!=='Germany'" class="meta-tag">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span x-text="job.location"></span>
            </span>
            <span x-show="job.remote" class="meta-tag remote-tag">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              Remote
            </span>
            <span class="meta-tag source-tag" :class="'src-'+job.source" x-text="job.source"></span>
            <span class="meta-tag date-tag" x-show="relativeDate(job.posted || job.created_at)">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span x-text="relativeDate(job.posted || job.created_at)"></span>
            </span>
          </div>

          <!-- Reasoning -->
          <div class="reasoning" x-show="job.reasoning" x-text="job.reasoning"></div>

          <!-- Skills -->
          <div class="skills" x-show="job.matched_skills">
            <template x-for="s in (job.matched_skills||'').split(',').map(x=>x.trim()).filter(x=>x)" :key="s">
              <span class="skill-chip" x-text="s"></span>
            </template>
          </div>

          <!-- Description toggle -->
          <div class="desc-toggle" @click="job._open = !job._open">
            <svg class="toggle-chevron" :class="{open: job._open}" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            <span x-text="job._open ? 'Hide description' : 'Show description'"></span>
          </div>

          <!-- Description (expanded) -->
          <template x-if="job._open">
            <div>
              <template x-if="job.description && job.description.trim()">
                <div class="desc-box" x-text="job.description"></div>
              </template>
              <template x-if="!job.description || !job.description.trim()">
                <div class="desc-empty">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                  No description captured — open the job link to read the full posting.
                </div>
              </template>
            </div>
          </template>

          <!-- Actions -->
          <div class="card-actions">
            <button class="act-btn act-link" @click.stop="window.open(job.url,'_blank')" x-show="job.url">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              <span>Open Link</span>
            </button>
            <template x-if="job.status !== 'applied'">
              <button class="act-btn act-apply" @click.stop="applyJob(job)">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                <span>Mark Applied</span>
              </button>
            </template>
            <template x-if="job.status !== 'saved' && job.status !== 'applied'">
              <button class="act-btn act-save" @click.stop="setStatus(job,'saved')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                <span>Save</span>
              </button>
            </template>
            <template x-if="job.status !== 'rejected'">
              <button class="act-btn act-reject" @click.stop="setStatus(job,'rejected')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                <span>Reject</span>
              </button>
            </template>
            <template x-if="job.status !== 'new'">
              <button class="act-btn act-restore" @click.stop="setStatus(job,'new')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
                <span>Restore</span>
              </button>
            </template>
          </div>

        </div><!-- /card-inner -->
      </div><!-- /card -->
    </template>
  </div><!-- /grid -->

  <!-- Pagination -->
  <div class="pagination" x-show="totalPages > 1">
    <button class="page-btn" :disabled="currentPage <= 1" @click="goPage(currentPage - 1)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Prev
    </button>
    <span class="page-info" x-text="currentPage + ' / ' + totalPages"></span>
    <button class="page-btn" :disabled="currentPage >= totalPages" @click="goPage(currentPage + 1)">
      Next
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</main>

<!-- ── Pending Modal ── -->
<template x-if="showPending">
  <div class="modal-backdrop" @click.self="showPending=false">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Pending Analysis — <span x-text="pendingTotal"></span> jobs</span>
        <button class="modal-close" @click="showPending=false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <template x-if="pendingJobs.length === 0">
          <div style="text-align:center;padding:40px 0;color:var(--text3);">No pending jobs — all analyzed!</div>
        </template>
        <template x-for="pj in pendingJobs" :key="pj.slug">
          <div class="pending-row">
            <span class="pending-title" x-text="pj.title"></span>
            <span class="pending-company" x-text="pj.company"></span>
            <span class="pending-src source-tag" :class="'src-'+pj.source" x-text="pj.source"></span>
          </div>
        </template>
      </div>
      <div class="modal-footer">
        <span style="font-size:11px;color:var(--text3)" x-text="'Page ' + pendingPage + ' of ' + pendingTotalPages"></span>
        <div style="display:flex;gap:8px">
          <button class="page-btn" :disabled="pendingPage <= 1" @click="loadPending(pendingPage-1)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            Prev
          </button>
          <button class="page-btn" :disabled="pendingPage >= pendingTotalPages" @click="loadPending(pendingPage+1)">
            Next
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- ── Toast ── -->
<div class="toast-wrap">
  <template x-if="toast">
    <div class="toast">
      <div class="toast-dot" :class="toastType"></div>
      <span x-text="toast"></span>
    </div>
  </template>
</div>

<script>
function app() {
  return {
    jobs: [],
    stats: {},
    filterStatus: 'all',
    filterCategory: '',
    filterSource: '',
    filterDays: '',
    filterScore: 4,
    excludeSenior: false,
    currentPage: 1,
    perPage: 20,
    totalJobs: 0,
    totalPages: 1,
    searchQuery: '',
    _searchTimer: null,
    running: false,
    analyzing: false,
    toast: '',
    toastType: 'info',
    _toastTimer: null,
    showPending: false,
    pendingJobs: [],
    pendingTotal: 0,
    pendingPage: 1,
    pendingTotalPages: 1,

    async init() {
      await Promise.all([this.loadJobs(), this.loadStats()]);
      setInterval(() => this.loadStats(), 30000);
    },

    async loadJobs() {
      const p = new URLSearchParams();
      if (this.filterStatus !== 'all') p.set('status', this.filterStatus);
      if (this.filterSource)    p.set('source', this.filterSource);
      if (this.filterScore > 4) p.set('min_score', this.filterScore);
      if (this.filterDays)      p.set('days', this.filterDays);
      if (this.filterCategory)  p.set('category', this.filterCategory);
      if (this.excludeSenior)   p.set('exclude_senior', 'true');
      if (this.searchQuery.trim()) p.set('search', this.searchQuery.trim());
      p.set('page', this.currentPage);
      p.set('per_page', this.perPage);
      const res = await fetch('/api/jobs?' + p.toString());
      const data = await res.json();
      this.jobs = data.jobs.map(j => ({ ...j, _open: false }));
      this.totalJobs = data.total;
      this.totalPages = Math.max(1, Math.ceil(data.total / this.perPage));
    },

    goPage(n) {
      this.currentPage = n;
      this.loadJobs();
    },

    debouncedSearch() {
      clearTimeout(this._searchTimer);
      this._searchTimer = setTimeout(() => this.goPage(1), 250);
    },

    relativeDate(dateStr) {
      if (!dateStr || !dateStr.trim()) return '';
      let date;
      if (dateStr.includes('T')) {
        date = new Date(dateStr);
      } else if (dateStr.includes(' ')) {
        date = new Date(dateStr.replace(' ', 'T') + 'Z'); // SQLite datetime — UTC
      } else {
        const [y, m, d] = dateStr.split('-').map(Number);
        date = new Date(y, m - 1, d); // date-only — local to avoid timezone shift
      }
      if (isNaN(date.getTime())) return '';
      const days = Math.floor((Date.now() - date) / 86400000);
      if (days <= 0) return 'Today';
      if (days === 1) return 'Yesterday';
      if (days < 7) return days + 'd ago';
      if (days < 30) return Math.floor(days / 7) + 'w ago';
      return Math.floor(days / 30) + 'mo ago';
    },

    async loadStats() {
      const res = await fetch('/api/stats');
      this.stats = await res.json();
    },

    async openPendingModal() {
      this.showPending = true;
      await this.loadPending(1);
    },

    async loadPending(page = 1) {
      this.pendingPage = page;
      const res = await fetch(`/api/jobs/pending?page=${page}&per_page=30`);
      const data = await res.json();
      this.pendingJobs = data.jobs;
      this.pendingTotal = data.total;
      this.pendingTotalPages = Math.max(1, Math.ceil(data.total / 30));
    },

    async setStatus(job, status) {
      await fetch(`/api/jobs/${job.slug}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
      const shouldDisappear =
        (this.filterStatus === 'all' && (status === 'saved' || status === 'applied' || status === 'rejected')) ||
        (this.filterStatus === 'new' && status !== 'new') ||
        (this.filterStatus === 'saved' && status !== 'saved') ||
        (this.filterStatus === 'applied' && status !== 'applied') ||
        (this.filterStatus === 'rejected' && status !== 'rejected');
      if (shouldDisappear) {
        this.jobs = this.jobs.filter(j => j.slug !== job.slug);
        this.totalJobs = Math.max(0, this.totalJobs - 1);
      } else {
        job.status = status;
      }
      this.loadStats();
    },

    async applyJob(job) {
      await this.setStatus(job, 'applied');
    },

    async runScraper() {
      this.running = true;
      await fetch('/api/run-scraper', { method: 'POST' });
      this.showToast('Scraper started — new jobs will appear after analysis.', 'ok');
      setTimeout(() => { this.running = false; }, 8000);
    },

    async runAnalysis() {
      this.analyzing = true;
      await fetch('/api/run-analysis', { method: 'POST' });
      this.showToast('Analyzing pending jobs in background…', 'info');
      const poll = setInterval(async () => {
        await this.loadStats();
        if (this.stats.pending_analysis === 0) {
          clearInterval(poll);
          this.analyzing = false;
          await this.loadJobs();
          this.showToast('Analysis complete — list refreshed.', 'ok');
        }
      }, 5000);
      setTimeout(() => { clearInterval(poll); this.analyzing = false; }, 300000);
    },

    showToast(msg, type = 'info') {
      this.toast = msg;
      this.toastType = type;
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => { this.toast = ''; }, 4000);
    },
  };
}
</script>
</body>
</html>
